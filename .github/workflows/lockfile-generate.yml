name: Generate Gradle lockfile for Dependabot

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: lockfile-generate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-lockfile:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/gradle/') && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    name: Regenerating lockfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963cec38e04b3d30dcc455b5382be2fdbfb

      - name: Regenerate dependency lockfile
        run: |
          ./gradlew dependencies --write-locks --no-daemon

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gradle-lockfile
          path: gradle.lockfile
          if-no-files-found: error
