name: Sync Gradle lockfile for Dependabot

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: lockfile-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.event.pull_request.head.ref, 'dependabot/gradle/') && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    name: Syncing lockfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Regenerate dependency lockfile
        run: |
          ./gradlew dependencies --write-locks --no-daemon

      - name: Commit and push lockfile changes
        run: |
          if git diff --exit-code -- gradle.lockfile; then
            echo "gradle.lockfile is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.lockfile
          git commit -m "chore: sync gradle.lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}