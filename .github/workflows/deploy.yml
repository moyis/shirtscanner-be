on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: registry.fly.io/shirtscanner-be:${{ github.sha }}

name: Deploy

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Tests
        timeout-minutes: 25
        run: |
          ./gradlew test

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: test
    concurrency: deployment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Login to Docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Docker Image
        run: |
          ./gradlew bootBuildImage --imageName $IMAGE_NAME

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy -i $IMAGE_NAME

  smoke:
    runs-on: ubuntu-latest
    name: Smoke Test
    needs: deploy
    steps:
      - name: Smoke check production API
        run: |
          curl --fail --silent --show-error --output /dev/null --max-time 30 https://api.shirtscanner.com/v1/providers
