on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: registry.fly.io/shirtscanner-be:${{ github.sha }}

name: Deploy

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Run Tests
        timeout-minutes: 25
        run: |
          ./gradlew test --no-daemon

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: test
    concurrency: deployment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Login to Docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl auth docker

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Build Native App Image
        run: |
          ./gradlew bootBuildImage --imageName shirtscanner-be-app --no-daemon

      - name: Download and verify curl-impersonate
        run: |
          curl -fsSL -o curl-impersonate.tar.gz "https://github.com/lexiforest/curl-impersonate/releases/download/v2.2.3/curl-impersonate-v2.2.3.x86_64-linux-gnu.tar.gz"
          echo "ca7c8aae49e33260d3a2400db16c7737aaf04692d606a843502056b42990f989  curl-impersonate.tar.gz" | sha256sum --check -
          mkdir curl-impersonate-extract
          tar -xzf curl-impersonate.tar.gz -C curl-impersonate-extract curl-impersonate
          chmod +x curl-impersonate-extract/curl-impersonate

      - name: Build Wrapper Image
        run: |
          CTX=$(mktemp -d)
          cp deploy/Dockerfile "$CTX/"
          cp curl-impersonate-extract/curl-impersonate "$CTX/"
          docker build --build-arg BASE_IMAGE=shirtscanner-be-app -f "$CTX/Dockerfile" -t $IMAGE_NAME "$CTX"

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy -i $IMAGE_NAME

  smoke:
    runs-on: ubuntu-latest
    name: Smoke Test
    needs: deploy
    steps:
      - name: Smoke check production API
        run: |
          curl --fail --silent --show-error --output /dev/null --max-time 30 https://api.shirtscanner.com/v1/providers
