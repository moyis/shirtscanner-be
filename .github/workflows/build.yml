on:
  push:
    branches-ignore:
      - main

name: Build and Test code

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build and Test
        timeout-minutes: 25
        run: |
          ./gradlew build --no-daemon

      - name: Verify dependency locks are up to date
        run: |
          ./gradlew dependencies --write-locks --no-daemon
          git diff --exit-code -- gradle.lockfile
  build-native:
    runs-on: ubuntu-latest
    name: Build Native
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc
        with:
          java-version: 25
          distribution: graalvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Compile Native Image
        run: |
          ./gradlew nativeCompile --no-daemon