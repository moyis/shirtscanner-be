on:
  push:
    branches-ignore:
      - main

name: Build and Test code

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and Test
        timeout-minutes: 25
        run: |
          ./gradlew build

      - name: Verify dependency locks are up to date
        run: |
          ./gradlew dependencies --write-locks
          git diff --exit-code -- gradle.lockfile
  build-native:
    runs-on: ubuntu-latest
    name: Build Native
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile Native Image
        run: |
          ./gradlew nativeCompile