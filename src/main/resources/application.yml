spring:
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      auto-index-creation: false
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:${SPRING_MONGODB_URI:mongodb://localhost/test}}

search-result-cache:
  ttl: 24h

document-fetcher:
  default-timeout: 15s

